[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "trendscale"
dynamic = ["version"]
description = "Google Trends API for Python: compare any number of terms on one 0-100 scale, regions, related queries and trending now. A maintained pytrends alternative."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Famed Bonobo" }]
keywords = [
    "google trends", "google trends api", "pytrends", "pytrends alternative", "trends", "search interest",
    "keyword research", "seo", "related queries", "trending searches",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.27", "typing-extensions>=4.12"]

[project.optional-dependencies]
socks = ["httpx[socks]>=0.27"]
pandas = ["pandas>=2.0"]

[project.scripts]
trendscale = "trendscale.cli:main"

[project.urls]
Homepage = "https://github.com/famed-bonobo/trendscale"
Issues = "https://github.com/famed-bonobo/trendscale/issues"
Changelog = "https://github.com/famed-bonobo/trendscale/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/trendscale/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/trendscale"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: calls Google for real; run with -m live"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Google writes times and prices with narrow no-break spaces, and the parsers match those characters on purpose.
ignore = ["RUF001"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
python_version = "3.11"
